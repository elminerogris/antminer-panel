<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/logo.png">
    <title>Hosting Login — El Minero Gris</title>
    <script>try{if(localStorage.getItem('emg_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
    <style>
        :root {
            --bg-main: #0a0c12;
            --bg-card: #121521;
            --bg-input: rgba(10, 12, 18, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --blue: #3366ff;
            --blue-light: #60a5fa;
            --green: #00e676;
            --red: #ff5252;
        }
        :root[data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --blue: #2563eb;
            --blue-light: #2563eb;
            --green: #059669;
            --red: #dc2626;
        }
        :root[data-theme="light"] .login-box { box-shadow: 0 12px 32px rgba(15, 23, 42, 0.10); }
        :root[data-theme="light"] .error-box { color: #b91c1c; background: rgba(220, 38, 38, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%; max-width: 420px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .login-logo {
            text-align: center; margin-bottom: 24px;
        }
        .login-logo img { height: 48px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(51, 102, 255, 0.4)); }
        .login-logo h1 { font-size: 1.3em; }
        .login-logo p { font-size: 0.84em; color: var(--text-muted); margin-top: 4px; }
        .login-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(51, 102, 255, 0.12); border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 5px 14px; border-radius: 999px; font-weight: bold; font-size: 0.78em;
            color: var(--blue-light); margin-top: 8px;
        }

        .inp-group { margin-bottom: 16px; }
        .inp-group label {
            display: block; font-size: 0.74em; color: var(--text-muted);
            text-transform: uppercase; font-weight: bold; margin-bottom: 6px;
        }
        .inp-group input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); padding: 11px 14px; border-radius: 8px;
            font-size: 0.92em; outline: none;
        }
        .inp-group input:focus { border-color: var(--blue); box-shadow: 0 0 10px rgba(51, 102, 255, 0.2); }

        .btn-login {
            width: 100%; background: linear-gradient(135deg, #3366ff 0%, #2563eb 100%);
            color: #fff; border: 1px solid var(--blue-light); padding: 12px;
            border-radius: 8px; font-weight: bold; font-size: 0.95em; cursor: pointer;
            margin-top: 4px; transition: all 0.2s;
        }
        .btn-login:hover { box-shadow: 0 0 20px rgba(51, 102, 255, 0.4); transform: translateY(-1px); }

        .error-box {
            background: rgba(255, 82, 82, 0.12); border: 1px solid rgba(255, 82, 82, 0.4);
            color: #ff8a80; padding: 10px 14px; border-radius: 8px;
            margin-bottom: 16px; font-size: 0.84em; font-weight: 600;
        }
        .foot { text-align: center; margin-top: 20px; font-size: 0.78em; color: var(--text-muted); }
        .foot a { color: var(--blue-light); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:12px;">
            <button type="button" id="btnTemaStandalone" class="emg-theme-btn" title="Cambiar tema claro/oscuro" onclick="toggleTemaStandalone(this)">☀️</button>
            <select id="langSelectorStandalone" class="emg-mini-lang notranslate" translate="no" aria-label="Idioma" onchange="cambiarIdiomaStandalone(this.value)">
                <option value="es" translate="no" data-short="🌐 ES" data-full="🌐 Español">🌐 Español</option>
                <option value="en" translate="no" data-short="🌐 EN" data-full="🌐 English">🌐 English</option>
                <option value="pt" translate="no" data-short="🌐 PT" data-full="🌐 Português">🌐 Português</option>
                <option value="ru" translate="no" data-short="🌐 RU" data-full="🌐 Русский">🌐 Русский</option>
                <option value="zh-CN" translate="no" data-short="🌐 ZH" data-full="🌐 中文">🌐 中文</option>
                <option value="hi" translate="no" data-short="🌐 HI" data-full="🌐 हिन्दी">🌐 हिन्दी</option>
                <option value="ar" translate="no" data-short="🌐 AR" data-full="🌐 العربية">🌐 العربية</option>
                <option value="bn" translate="no" data-short="🌐 BN" data-full="🌐 বাংলা">🌐 বাংলা</option>
                <option value="fr" translate="no" data-short="🌐 FR" data-full="🌐 Français">🌐 Français</option>
                <option value="de" translate="no" data-short="🌐 DE" data-full="🌐 Deutsch">🌐 Deutsch</option>
            </select>
        </div>
        <div class="login-logo">
            <img src="/static/logo.png" alt="Logo" onerror="this.outerHTML='<span style=\'font-size:2em;\'>⛏️</span>'">
            <h1>Portal de Cliente</h1>
            <p>Monitoreo de tus equipos de minería en tiempo real</p>
            <span class="login-badge">🔒 Acceso Seguro · Hosting</span>
        </div>

        {% if error %}
        <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/hosting/login">
            <div class="inp-group">
                <label>Usuario</label>
                <input type="text" name="username" placeholder="Tu usuario de hosting" required autofocus>
            </div>
            <div class="inp-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">🔐 Ingresar a Mi Panel</button>
        </form>

        <div class="foot">
            Panel impulsado por <a href="https://elminerogris.com" target="_blank" rel="noopener">El Minero Gris</a>
        </div>
    </div>
    {% include "_lang_sync.html" %}
</body>
</html>
