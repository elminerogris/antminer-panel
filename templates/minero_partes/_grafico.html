<div class="card" style="position: relative; overflow: visible; z-index: 20; padding-left: 16px; padding-right: 16px;">

<script>
    const unidadMinero = "{{ ultimo.unidad }}";
    const rawFechas = {{ graf_fechas_raw | safe }};
    const rawHr = {{ graf_hashrate | safe }};
    const rawTemp = {{ graf_temps | safe }};
    const rawAmb = {{ graf_temp_amb | default('[]') | safe }};
    const rawErr = {{ graf_errores | default('[]') | safe }};
    const rawCadHist = {{ graf_cadenas_hist | default('[]') | safe }};
    const cadenasActuales = {{ cadenas_json | default('[]') | safe }};
    const tempAmbActual = {{ ultimo.temp_amb | default(0) }};

    let chartInstance = null;
    let rangoActual = '24h';
    let cursorDentroArea = false;
    let mapaMetaPuntos = {};
    let cacheClimaExterior = []; // [{ts, temp, sensacion}]
    let nombreCiudadClima = "";
    // Conserva qué curvas apagó o encendió el usuario para que no se reseteen al cambiar de rango
    let visibilidadCurvas = {};

    function formatearFechaTooltip(d) {
        let dia = String(d.getDate()).padStart(2, '0');
        let mes = String(d.getMonth() + 1).padStart(2, '0');
        let anio = String(d.getFullYear()).slice(-2);
        let horas = String(d.getHours()).padStart(2, '0');
        let mins = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${anio} ${horas}:${mins}`;
    }

    function formatearEtiquetaEjeX(d, rango) {
        let horas = String(d.getHours()).padStart(2, '0');
        let mins = String(d.getMinutes()).padStart(2, '0');
        let horaStr = `${horas}:${mins}`;
        if (rango === '7d' || rango === '30d') {
            let dia = String(d.getDate()).padStart(2, '0');
            let mes = String(d.getMonth() + 1).padStart(2, '0');
            return [horaStr, `${dia}/${mes}`];
        }
        return horaStr;
    }

    // Fórmula oficial NOAA Rothfusz Heat Index (Sin Humidex para no inflar la temperatura por encima de Google Weather)
    function calcularSensacionTermicaNOAA(tempC, humedadPct, apparentFallback) {
        if (tempC >= 26.5 && humedadPct >= 40) {
            let T = (tempC * 9 / 5) + 32;
            let R = humedadPct;
            let HI = -42.379
                     + 2.04901523 * T
                     + 10.14333127 * R
                     - 0.22475541 * T * R
                     - 0.00683783 * T * T
                     - 0.05481717 * R * R
                     + 0.00122874 * T * T * R
                     + 0.00085282 * T * R * R
                     - 0.00000199 * T * T * R * R;
            let hiC = (HI - 32) * 5 / 9;
            return Math.round(Math.max(tempC, hiC));
        }
        if (apparentFallback !== null && apparentFallback !== undefined && !isNaN(apparentFallback)) {
            return Math.round(Number(apparentFallback));
        }
        return Math.round(tempC);
    }

    // Detecta la ubicación real en cualquier país del mundo usando GPS o triple respaldo de IP
    async function detectarUbicacionMundial(forzarGps = false) {
        if (!forzarGps) {
            try {
                const guardado = localStorage.getItem('emg_geo_cache_v4');
                if (guardado) {
                    const obj = JSON.parse(guardado);
                    if (obj.lat && obj.lon && (Date.now() - obj.ts < 1800000)) {
                        return obj;
                    }
                }
            } catch(e) {}
        }

        const probarGps = () => new Promise((resolve) => {
            if (!navigator.geolocation) return resolve(null);
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = Number(pos.coords.latitude.toFixed(4));
                    const lon = Number(pos.coords.longitude.toFixed(4));
                    let nombreLugar = "Ubicación GPS";
                    try {
                        const rNom = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=14&accept-language=es`);
                        if (rNom.ok) {
                            const jNom = await rNom.json();
                            const addr = jNom.address || {};
                            const barrio = addr.suburb || addr.neighbourhood || addr.quarter || "";
                            const ciudad = addr.city || addr.town || addr.village || addr.state || "";
                            nombreLugar = (barrio && ciudad) ? `${barrio}, ${ciudad}` : (ciudad || barrio || "GPS Local");
                        }
                    } catch(e) {}
                    resolve({ lat, lon, ciudad: nombreLugar });
                },
                () => resolve(null),
                { enableHighAccuracy: true, timeout: 3000, maximumAge: 300000 }
            );
        });

        let loc = await probarGps();

        if (!loc) {
            const apisIp = [
                {
                    url: "https://ipwho.is/",
                    parse: (j) => (j && j.success !== false && j.latitude && j.longitude) ? { lat: Number(j.latitude), lon: Number(j.longitude), ciudad: j.city || j.region || j.country } : null
                },
                {
                    url: "https://freeipapi.com/api/json",
                    parse: (j) => (j && j.latitude && j.longitude) ? { lat: Number(j.latitude), lon: Number(j.longitude), ciudad: j.cityName || j.regionName || j.countryName } : null
                },
                {
                    url: "https://ipapi.co/json/",
                    parse: (j) => (j && j.latitude && j.longitude) ? { lat: Number(j.latitude), lon: Number(j.longitude), ciudad: j.city || j.region || j.country_name } : null
                }
            ];

            for (let api of apisIp) {
                try {
                    const r = await fetch(api.url);
                    if (r.ok) {
                        const j = await r.json();
                        const res = api.parse(j);
                        if (res && !isNaN(res.lat) && !isNaN(res.lon)) {
                            loc = res;
                            break;
                        }
                    }
                } catch(e) {}
            }
        }

        if (loc) {
            try {
                localStorage.setItem('emg_geo_cache_v4', JSON.stringify({ ...loc, ts: Date.now() }));
            } catch(e) {}
        }
        return loc;
    }

    function forzarActualizacionUbicacion() {
        localStorage.removeItem('emg_geo_cache_v4');
        cargarClimaExteriorAutomatico(true);
    }

    async function cargarClimaExteriorAutomatico(forzarGps = false) {
        try {
            const ubicacion = await detectarUbicacionMundial(forzarGps);
            if (!ubicacion || ubicacion.lat === undefined || ubicacion.lon === undefined) return;

            const { lat, lon, ciudad } = ubicacion;
            const ahoraTs = Math.floor(Date.now() / 1000);

            // 1. Consultar la Estación Meteorológica Oficial en Vivo (METAR Aeropuerto local vía wttr.in)
            // Las estaciones METAR miden la temperatura real del aire con termómetro físico (idéntico a Google Weather: 32°C / 38°C)
            let tempMetarVivo = null;
            let humMetarVivo = null;

            const promesaMetar = fetch(`https://wttr.in/${lat},${lon}?format=j1`)
                .then(r => r.ok ? r.json() : null)
                .then(jW => {
                    if (jW && jW.current_condition && jW.current_condition[0]) {
                        const cc = jW.current_condition[0];
                        let tM = Number(cc.temp_C);
                        let hM = Number(cc.humidity);
                        // Validar que sea un rango físico coherente (-50°C a +55°C)
                        if (!isNaN(tM) && tM >= -50 && tM <= 55) {
                            tempMetarVivo = tM;
                            humMetarVivo = (!isNaN(hM) && hM > 0) ? hM : 60;
                        }
                    }
                }).catch(() => {});

            // 2. Consultar curva horaria de 30 días en Open-Meteo (SIN gfs_seamless crudo para que no infle a 38°C)
            const urlMeteo = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m&hourly=temperature_2m,apparent_temperature,relative_humidity_2m&past_days=30&forecast_days=1&timeformat=unixtime&timezone=GMT`;

            const [_, rMet] = await Promise.all([promesaMetar, fetch(urlMeteo)]);
            if (!rMet || !rMet.ok) return;
            const jMet = await rMet.json();

            if (jMet.hourly && jMet.hourly.time && jMet.hourly.temperature_2m) {
                cacheClimaExterior = [];
                const times = jMet.hourly.time;
                const temps = jMet.hourly.temperature_2m;
                const appTemps = jMet.hourly.apparent_temperature || [];
                const hums = jMet.hourly.relative_humidity_2m || [];

                // Calibración inteligente: si la estación física METAR tiene una diferencia con el satélite en la hora actual,
                // calculamos el offset suave para calibrar las horas del día actual
                let tempSateliteActual = (jMet.current && jMet.current.temperature_2m !== undefined) ? Number(jMet.current.temperature_2m) : null;
                let humSateliteActual = (jMet.current && jMet.current.relative_humidity_2m !== undefined) ? Number(jMet.current.relative_humidity_2m) : 60;

                // Si METAR respondió (ej. 32°C), usamos la estación física real; si no, usamos el satélite con corrección
                let tempRealHoy = (tempMetarVivo !== null) ? Math.round(tempMetarVivo) : (tempSateliteActual !== null ? Math.round(tempSateliteActual) : null);
                let humRealHoy = (humMetarVivo !== null) ? humMetarVivo : humSateliteActual;
                let offsetCalibracion = (tempRealHoy !== null && tempSateliteActual !== null) ? (tempRealHoy - tempSateliteActual) : 0;
                // Limitar el offset máximo a ±4°C por seguridad
                if (offsetCalibracion > 4) offsetCalibracion = 4;
                if (offsetCalibracion < -4) offsetCalibracion = -4;

                for (let i = 0; i < times.length; i++) {
                    const tsHora = Number(times[i]);
                    // Solo guardar historial hasta la hora actual (descartar horas futuras de la noche)
                    if (tsHora <= ahoraTs + 900 && temps[i] !== null && temps[i] !== undefined) {
                        let tBase = Number(temps[i]);
                        // Aplicar calibración gradual en las últimas 6 horas para que la curva empalme perfecto con la estación local
                        let horasAtras = (ahoraTs - tsHora) / 3600;
                        let factorCal = (horasAtras >= 0 && horasAtras <= 6) ? (1 - (horasAtras / 6)) : 0;
                        let tCalibrada = Math.round(tBase + (offsetCalibracion * factorCal));

                        let hum = (hums[i] !== undefined && hums[i] !== null) ? Number(hums[i]) : 60;
                        let stCalc = calcularSensacionTermicaNOAA(tCalibrada, hum, appTemps[i]);

                        cacheClimaExterior.push({
                            ts: tsHora,
                            temp: tCalibrada,
                            sensacion: stCalc
                        });
                    }
                }

                let sensRealHoy = null;
                if (tempRealHoy !== null) {
                    let appCur = (jMet.current && jMet.current.apparent_temperature !== undefined) ? Number(jMet.current.apparent_temperature) : tempRealHoy;
                    sensRealHoy = calcularSensacionTermicaNOAA(tempRealHoy, humRealHoy, appCur);

                    cacheClimaExterior.push({
                        ts: ahoraTs,
                        temp: tempRealHoy,
                        sensacion: sensRealHoy
                    });
                }

                cacheClimaExterior.sort((a, b) => a.ts - b.ts);

                nombreCiudadClima = ciudad || "Exterior";
                const badge = document.getElementById('climaUbicacionBadge');
                if (badge && cacheClimaExterior.length > 0) {
                    const ultimoClima = cacheClimaExterior[cacheClimaExterior.length - 1];
                    const tMostrar = tempRealHoy !== null ? tempRealHoy : ultimoClima.temp;
                    const sMostrar = sensRealHoy !== null ? sensRealHoy : ultimoClima.sensacion;
                    badge.innerHTML = `📍 ${nombreCiudadClima}: <b>${tMostrar}°C</b> <span style="color:#c084fc;">(Sensación ${sMostrar}°C)</span>`;
                    badge.style.display = 'inline-block';
                    document.getElementById('statClimaHoy').innerHTML = `${tMostrar}°C / <span style="color:#c084fc;">${sMostrar}°C</span>`;
                }
                updateChart(rangoActual);
            }
        } catch (err) {
            console.log("Clima exterior opcional no disponible:", err);
        }
    }

    function obtenerClimaParaTimestamp(ts) {
        if (!cacheClimaExterior || cacheClimaExterior.length === 0) return null;
        let n = cacheClimaExterior.length;
        if (ts <= cacheClimaExterior[0].ts) return cacheClimaExterior[0];
        if (ts >= cacheClimaExterior[n - 1].ts) return cacheClimaExterior[n - 1];

        let izq = 0, der = n - 1;
        while (izq <= der) {
            let mid = (izq + der) >> 1;
            let midTs = cacheClimaExterior[mid].ts;
            if (midTs === ts) return cacheClimaExterior[mid];
            if (midTs < ts) izq = mid + 1;
            else der = mid - 1;
        }

        let pPrev = cacheClimaExterior[Math.max(0, der)];
        let pNext = cacheClimaExterior[Math.min(n - 1, izq)];
        let span = pNext.ts - pPrev.ts;
        if (span <= 0 || span > 7200) return pPrev;
        let ratio = (ts - pPrev.ts) / span;
        return {
            temp: Math.round(pPrev.temp + ratio * (pNext.temp - pPrev.temp)),
            sensacion: Math.round(pPrev.sensacion + ratio * (pNext.sensacion - pPrev.sensacion))
        };
    }

    // Plugin profesional 1: Dibuja los números de Hashrate (izq) y Temperatura (der) DENTRO del gráfico
    const pluginNumerosDentroGrafico = {
        id: 'numerosDentroGrafico',
        afterDraw: function(chart) {
            const ctx = chart.ctx;
            const ca = chart.chartArea;
            const yAxis = chart.scales.y;
            const y1Axis = chart.scales.y1;
            if (!ca) return;

            ctx.save();
            ctx.font = 'bold 10.5px sans-serif';
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'rgba(13, 15, 23, 0.85)';

            if (yAxis && yAxis.ticks) {
                ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(165, 167, 181, 0.88)';
                yAxis.ticks.forEach((t, idx) => {
                    const yPos = yAxis.getPixelForTick(idx);
                    if (yPos >= ca.top - 2 && yPos <= ca.bottom + 2) {
                        const offsetY = (idx === 0) ? -5 : (idx === yAxis.ticks.length - 1 ? 10 : -4);
                        const txt = String(t.value);
                        ctx.strokeText(txt, ca.left + 5, yPos + offsetY);
                        ctx.fillText(txt, ca.left + 5, yPos + offsetY);
                    }
                });
            }

            if (y1Axis && y1Axis.ticks) {
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(255, 179, 0, 0.85)';
                y1Axis.ticks.forEach((t, idx) => {
                    const yPos = y1Axis.getPixelForTick(idx);
                    if (yPos >= ca.top - 2 && yPos <= ca.bottom + 2) {
                        const offsetY = (idx === 0) ? -5 : (idx === y1Axis.ticks.length - 1 ? 10 : -4);
                        const txt = t.value + '°';
                        ctx.strokeText(txt, ca.right - 5, yPos + offsetY);
                        ctx.fillText(txt, ca.right - 5, yPos + offsetY);
                    }
                });
            }
            ctx.restore();
        }
    };

    // Plugin profesional 2: Línea Guía Vertical (Crosshair)
    const pluginCrosshairVertical = {
        id: 'crosshairVertical',
        afterDraw: function(chart) {
            if (!cursorDentroArea || !chart.tooltip || !chart.tooltip._active || !chart.tooltip._active.length) return;
            const activePoint = chart.tooltip._active[0];
            const ctx = chart.ctx;
            const x = activePoint.element.x;
            const topY = chart.chartArea.top;
            const bottomY = chart.chartArea.bottom;

            ctx.save();
            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(x, topY);
            ctx.lineTo(x, bottomY);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
            ctx.stroke();
            ctx.restore();
        }
    };

    function ocultarTooltipGris() {
        cursorDentroArea = false;
        const ttEl = document.getElementById('customChartTooltip');
        if (ttEl) ttEl.style.display = 'none';
        if (chartInstance) {
            chartInstance.setActiveElements([]);
            chartInstance.update('none');
        }
    }

    function renderizarTooltipExterno(context) {
        const { chart, tooltip } = context;
        const ttEl = document.getElementById('customChartTooltip');
        if (!ttEl) return;

        if (tooltip.opacity === 0 || !cursorDentroArea || !tooltip.dataPoints || tooltip.dataPoints.length === 0) {
            ttEl.style.display = 'none';
            return;
        }

        const dp0 = tooltip.dataPoints[0];
        const tsSegundos = dp0.parsed.x;
        const meta = mapaMetaPuntos[tsSegundos];

        if (!meta || meta.esSeparadorCorte) {
            ttEl.style.display = 'none';
            return;
        }

        const titulo = formatearFechaTooltip(new Date(tsSegundos * 1000));
        let deltaT = "";
        if (meta.temp > 0 && (meta.amb || meta.clima !== null)) {
            let refAmb = meta.amb || meta.clima;
            let diff = meta.temp - refAmb;
            let signo = diff >= 0 ? '+' : '';
            deltaT = `<span style="color:#a5a7b5; font-size:0.88em;">ΔT ${signo}${diff}°C</span>`;
        }
        let html = `<div class="tt-title"><span>${titulo}</span>${deltaT}</div>`;

        if (meta.estadoPunto === 'SIN_MINAR') {
            html += `<div class="tt-row"><span class="tt-box" style="background:#ff5252;"></span>⚡ Hashrate: <b style="color:#ff5252;">0 ${unidadMinero} (Detenido)</b></div>`;
            if (meta.temp > 0) {
                html += `<div class="tt-row"><span class="tt-box" style="background:#ffb300;"></span>🌡️ Temp Max: <b>${meta.temp}°C</b> (Equipo encendido)</div>`;
            }
            if (meta.clima !== null && meta.clima !== undefined) {
                let txtSens = (meta.sensacion !== null && meta.sensacion !== undefined) ? ` (Sensación: <b style="color:#c084fc;">${meta.sensacion}°C</b>)` : '';
                html += `<div class="tt-row"><span class="tt-box" style="background:#38bdf8;"></span>🌤️ Clima Exterior: <b>${meta.clima}°C</b>${txtSens}</div>`;
            }
            html += `<div class="tt-badge-status" style="background:rgba(255,82,82,0.18); color:#ff5252;">⚠️ Alerta: Encendido pero sin minar</div>`;
        } else {
            html += `<div class="tt-row"><span class="tt-box" style="background:#3366ff;"></span>⚡ Hashrate: <b>${meta.hr} ${unidadMinero}</b></div>`;
            if (meta.temp > 0) {
                let estadoT = meta.temp >= 85 ? '🔴 Crítica' : (meta.temp >= 75 ? '🟠 Advertencia' : '🟢 Normal');
                let txtMin = (meta.tempMin && meta.tempMin > 0) ? ` / Mín PCB: <b>${meta.tempMin}°C</b>` : '';
                html += `<div class="tt-row"><span class="tt-box" style="background:#ffb300;"></span>🌡️ Temp Máx: <b>${meta.temp}°C</b>${txtMin} (${estadoT})</div>`;
                let cads = meta.cadenas || cadenasActuales;
                if (cads && cads.length > 0) {
                    for (let c = 0; c < cads.length; c++) {
                        if (cads[c].temp_c > 0 || cads[c].temp_p > 0) {
                            html += `<div class="tt-sub">Placa #${cads[c].id} -> Chip: ${cads[c].temp_c}°C | PCB: ${cads[c].temp_p}°C</div>`;
                        }
                    }
                }
            }
            if (meta.amb && meta.amb > 0) {
                html += `<div class="tt-row"><span class="tt-box" style="background:#00e676;"></span>🍃 Temp Entrada/Amb: <b>${meta.amb}°C</b></div>`;
            }
            if (meta.clima !== null && meta.clima !== undefined) {
                html += `<div class="tt-row"><span class="tt-box" style="background:#38bdf8;"></span>🌤️ Clima Exterior: <b>${meta.clima}°C</b></div>`;
            }
            if (meta.sensacion !== null && meta.sensacion !== undefined) {
                html += `<div class="tt-row"><span class="tt-box" style="background:#c084fc;"></span>🥵 Sensación Térmica: <b>${meta.sensacion}°C</b></div>`;
            }
            let errNuevos = meta.err || 0;
            let ds = meta.deltaS || 30;
            let porSeg = (errNuevos / ds).toFixed(2);
            html += `<div class="tt-row"><span class="tt-box" style="background:#ff5252;"></span>⚠️ Errores HW: <b>${errNuevos} nuevos</b> (${porSeg} /s)</div>`;
        }

        ttEl.innerHTML = html;
        ttEl.style.display = 'block';

        const chartArea = chart.chartArea;
        const wrapperW = chart.canvas.clientWidth;
        const ttW = ttEl.offsetWidth || 235;

        let posX = tooltip.caretX;
        const minX = (ttW / 2) + 6;
        const maxX = wrapperW - (ttW / 2) - 6;
        if (posX < minX) posX = minX;
        if (posX > maxX) posX = maxX;

        ttEl.style.left = posX + 'px';
        ttEl.style.top = (chartArea.bottom + 2) + 'px';
    }

    function construirLeyendasPildora() {
        const cont = document.getElementById('customLegendsBar');
        if (!cont || !chartInstance) return;
        cont.innerHTML = '';
        chartInstance.data.datasets.forEach((ds, index) => {
            const btn = document.createElement('div');
            const isHidden = !chartInstance.isDatasetVisible(index);
            btn.className = 'legend-pill' + (isHidden ? ' off' : '');
            btn.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor};"></span><span>${ds.label}</span>`;
            btn.onclick = function() {
                const vis = chartInstance.isDatasetVisible(index);
                chartInstance.setDatasetVisibility(index, !vis);
                visibilidadCurvas[ds.id] = !vis;
                chartInstance.update();
                construirLeyendasPildora();
            };
            cont.appendChild(btn);
        });
    }

    function resetearZoomGrafico() {
        if (!chartInstance) return;
        chartInstance.resetZoom();
        document.getElementById('btnResetZoom').style.display = 'none';
    }

    function descargarCapturaGrafico() {
        if (!chartInstance) return;
        const link = document.createElement('a');
        link.download = `Grafico_{{ ip }}_${rangoActual}.png`;
        link.href = chartInstance.toBase64Image();
        link.click();
    }

    function configurarEventosLimitesCanvas() {
        const canvas = document.getElementById('hashrateChart');
        if (!canvas) return;

        function validarPosicionCursor(clientX, clientY) {
            if (!chartInstance || !chartInstance.chartArea) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const ca = chartInstance.chartArea;

            if (y > ca.bottom || y < ca.top || x < ca.left || x > ca.right) {
                ocultarTooltipGris();
            } else {
                cursorDentroArea = true;
            }
        }

        canvas.addEventListener('mousemove', function(e) { validarPosicionCursor(e.clientX, e.clientY); });
        canvas.addEventListener('mouseleave', function() { ocultarTooltipGris(); });
        canvas.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length === 1) {
                validarPosicionCursor(e.touches[0].clientX, e.touches[0].clientY);
            } else {
                ocultarTooltipGris();
            }
        }, {passive: true});
        canvas.addEventListener('touchmove', function(e) {
            if (e.touches && e.touches.length === 1) {
                validarPosicionCursor(e.touches[0].clientX, e.touches[0].clientY);
            } else {
                ocultarTooltipGris();
            }
        }, {passive: true});
    }

    function extraerTempMinimaPlaca(cads, tempMaxFallback) {
        if (!cads || !Array.isArray(cads) || cads.length === 0) {
            return tempMaxFallback > 10 ? Math.max(15, tempMaxFallback - 8) : null;
        }
        let mins = [];
        for (let i = 0; i < cads.length; i++) {
            let tp = Number(cads[i].temp_p || 0);
            let tc = Number(cads[i].temp_c || 0);
            if (tp > 10) mins.push(tp);
            else if (tc > 10) mins.push(Math.max(15, tc - 6));
        }
        return mins.length > 0 ? Math.min(...mins) : null;
    }

    function procesarDatosLimpios(minTs) {
        let crudos = [];
        for (let i = 0; i < rawFechas.length; i++) {
            let ts = rawFechas[i];
            if (ts < minTs) continue;
            let hVal = rawHr[i] !== null && rawHr[i] !== undefined ? Number(rawHr[i]) : 0;
            let tVal = rawTemp[i] !== null && rawTemp[i] !== undefined ? Number(rawTemp[i]) : 0;

            if (hVal === 0 && tVal <= 5) continue;

            let ambVal = (hVal > 0 && rawAmb.length > i && rawAmb[i] !== null && rawAmb[i] > 0) ? Number(rawAmb[i]) : null;
            if (hVal > 0 && ambVal === null && i === rawFechas.length - 1 && tempAmbActual > 0) ambVal = tempAmbActual;

            let errVal = (rawErr.length > i && rawErr[i] !== null) ? Number(rawErr[i]) : 0;
            if (hVal === 0 || (i > 0 && Number(rawHr[i - 1] || 0) === 0)) {
                errVal = 0;
            }

            let cads = (rawCadHist.length > i && rawCadHist[i]) ? rawCadHist[i] : cadenasActuales;
            let tMinVal = hVal > 0 ? extraerTempMinimaPlaca(cads, tVal) : null;
            let objClima = obtenerClimaParaTimestamp(ts);
            let climaVal = objClima ? objClima.temp : null;
            let sensVal = objClima ? objClima.sensacion : null;

            crudos.push({ ts, hr: hVal, temp: tVal, tempMin: tMinVal, amb: ambVal, clima: climaVal, sensacion: sensVal, err: errVal, cads });
        }

        crudos.sort((a, b) => a.ts - b.ts);

        let ptsH = [], ptsT = [], ptsTMin = [], ptsA = [], ptsClima = [], ptsSens = [], ptsE = [];
        let valoresHr = [], valoresTempMax = [], valoresTempMin = [];
        mapaMetaPuntos = {};

        const UMBRAL_CORTE_SEG = 240;

        for (let i = 0; i < crudos.length; i++) {
            let actual = crudos[i];
            let deltaS = 30;

            if (i > 0) {
                let brecha = actual.ts - crudos[i - 1].ts;
                if (brecha <= 0) continue;
                deltaS = brecha <= 300 ? brecha : 30;

                if (brecha > UMBRAL_CORTE_SEG) {
                    let tsCorte = crudos[i - 1].ts + 1;
                    ptsH.push({ x: tsCorte, y: null });
                    ptsT.push({ x: tsCorte, y: null });
                    ptsTMin.push({ x: tsCorte, y: null });
                    ptsA.push({ x: tsCorte, y: null });
                    ptsClima.push({ x: tsCorte, y: null });
                    ptsSens.push({ x: tsCorte, y: null });
                    ptsE.push({ x: tsCorte, y: null });
                    mapaMetaPuntos[tsCorte] = { esSeparadorCorte: true };
                }
            }

            if (actual.hr === 0 && actual.temp > 5) {
                ptsH.push({ x: actual.ts, y: 0 });
                ptsT.push({ x: actual.ts, y: actual.temp });
                ptsTMin.push({ x: actual.ts, y: null });
                ptsA.push({ x: actual.ts, y: null });
                ptsClima.push({ x: actual.ts, y: actual.clima });
                ptsSens.push({ x: actual.ts, y: actual.sensacion });
                ptsE.push({ x: actual.ts, y: 0 });
                valoresTempMax.push(actual.temp);
                mapaMetaPuntos[actual.ts] = {
                    estadoPunto: 'SIN_MINAR',
                    hr: 0, temp: actual.temp, tempMin: null, amb: null, clima: actual.clima, sensacion: actual.sensacion, err: 0, deltaS: deltaS, cadenas: actual.cads
                };
            } else {
                let tempValida = actual.temp > 5 ? actual.temp : null;
                ptsH.push({ x: actual.ts, y: actual.hr });
                ptsT.push({ x: actual.ts, y: tempValida });
                ptsTMin.push({ x: actual.ts, y: actual.tempMin });
                ptsA.push({ x: actual.ts, y: actual.amb });
                ptsClima.push({ x: actual.ts, y: actual.clima });
                ptsSens.push({ x: actual.ts, y: actual.sensacion });
                ptsE.push({ x: actual.ts, y: actual.err });

                valoresHr.push(actual.hr);
                if (tempValida !== null) valoresTempMax.push(tempValida);
                if (actual.tempMin !== null) valoresTempMin.push(actual.tempMin);

                mapaMetaPuntos[actual.ts] = {
                    estadoPunto: 'NORMAL',
                    hr: actual.hr, temp: tempValida || 0, tempMin: actual.tempMin, amb: actual.amb, clima: actual.clima, sensacion: actual.sensacion, err: actual.err, deltaS: deltaS, cadenas: actual.cads
                };
            }
        }

        return { ptsH, ptsT, ptsTMin, ptsA, ptsClima, ptsSens, ptsE, valoresHr, valoresTempMax, valoresTempMin, totalRegistros: crudos.length };
    }

    function updateChart(rango) {
        rangoActual = rango;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        let btnR = document.getElementById('btn-' + rango);
        if (btnR) btnR.classList.add('active');
        document.getElementById('btnResetZoom').style.display = 'none';
        ocultarTooltipGris();
        
        const ultimoTsDato = rawFechas.length > 0 ? Math.max(...rawFechas) : Math.floor(Date.now() / 1000);
        const nowTs = Math.max(Math.floor(Date.now() / 1000), ultimoTsDato);
        let segundosRango = 24 * 3600;
        if (rango === '6h') segundosRango = 6 * 3600;
        if (rango === '24h') segundosRango = 24 * 3600;
        if (rango === '7d') segundosRango = 7 * 86400;
        if (rango === '30d') segundosRango = 30 * 86400;

        const minTs = nowTs - segundosRango;
        const { ptsH, ptsT, ptsTMin, ptsA, ptsClima, ptsSens, ptsE, valoresHr, valoresTempMax, valoresTempMin, totalRegistros } = procesarDatosLimpios(minTs);
        
        // Filtrar puntos de rampa de encendido (< 25% de la mediana) para que el Mínimo y Promedio reflejen la operación real
        let avgBruto = valoresHr.length > 0 ? (valoresHr.reduce((a,b)=>a+b,0) / valoresHr.length) : 0;
        let valoresHrOperativos = valoresHr.filter(v => v >= avgBruto * 0.25);
        if (valoresHrOperativos.length === 0) valoresHrOperativos = valoresHr;

        let avgHr = valoresHrOperativos.length > 0 ? (valoresHrOperativos.reduce((a,b)=>a+b,0) / valoresHrOperativos.length).toFixed(2) : "0.00";
        let maxHr = valoresHrOperativos.length > 0 ? Math.max(...valoresHrOperativos).toFixed(2) : "0.00";
        let minHr = valoresHrOperativos.length > 0 ? Math.min(...valoresHrOperativos).toFixed(2) : "0.00";
        let maxT = valoresTempMax.length > 0 ? Math.max(...valoresTempMax) : 0;
        let minT = valoresTempMin.length > 0 ? Math.min(...valoresTempMin) : 0;
        let pctEstab = totalRegistros > 0 ? Math.round((valoresHr.length / totalRegistros) * 100) : 100;

        document.getElementById('statProm').innerText = `${avgHr} ${unidadMinero}`;
        document.getElementById('statMax').innerText = `${maxHr} ${unidadMinero}`;
        document.getElementById('statMin').innerText = `${minHr} ${unidadMinero}`;
        let elTp = document.getElementById('statTempPico');
        elTp.innerText = `${maxT}° / ${minT}°C`;
        elTp.style.color = maxT >= 85 ? '#ff5252' : (maxT >= 75 ? '#ffb300' : '#00e676');
        document.getElementById('statUptime').innerText = `${pctEstab}%`;

        const ctx = document.getElementById('hashrateChart').getContext('2d');
        const gradBlue = ctx.createLinearGradient(0, 0, 0, 275);
        gradBlue.addColorStop(0, 'rgba(51, 102, 255, 0.30)');
        gradBlue.addColorStop(1, 'rgba(51, 102, 255, 0.0)');

        let tieneTempAmbiente = ptsA.some(p => p.y !== null && p.y > 0);
        let tieneClimaExt = ptsClima.some(p => p.y !== null && p.y !== undefined);

        let datasetsList = [
            {
                id: 'hr', type: 'line', label: '⚡ Hashrate (' + unidadMinero + ')', data: ptsH,
                borderColor: '#3366ff', backgroundColor: gradBlue, fill: true,
                tension: 0.1, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: '#3366ff',
                borderWidth: 2, spanGaps: false,
                hidden: visibilidadCurvas['hr'] === false
            },
            {
                id: 'tmax', type: 'line', label: '🌡️ Temp Máx °C', data: ptsT,
                borderColor: '#ffb300', borderDash: [5, 4],
                tension: 0.1, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: '#ffb300',
                borderWidth: 1.7, yAxisID: 'y1', spanGaps: false,
                hidden: visibilidadCurvas['tmax'] === false
            },
            {
                id: 'tmin', type: 'line', label: '❄️ Temp Mín (PCB) °C', data: ptsTMin,
                borderColor: '#fb923c', borderDash: [2, 4],
                backgroundColor: 'rgba(255, 179, 0, 0.07)', fill: '-1',
                tension: 0.1, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: '#fb923c',
                borderWidth: 1.2, yAxisID: 'y1', spanGaps: false,
                hidden: visibilidadCurvas['tmin'] === false
            }
        ];

        if (tieneTempAmbiente) {
            datasetsList.push({
                id: 'tamb', type: 'line', label: '🍃 Entrada/Amb °C', data: ptsA,
                borderColor: '#00e676', borderDash: [3, 3],
                tension: 0.1, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: '#00e676',
                borderWidth: 1.5, yAxisID: 'y1', spanGaps: false,
                hidden: visibilidadCurvas['tamb'] === false
            });
        }

        if (tieneClimaExt) {
            datasetsList.push({
                id: 'clima', type: 'line', label: '🌤️ Clima Exterior °C', data: ptsClima,
                borderColor: '#38bdf8', borderDash: [2, 2],
                tension: 0.2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: '#38bdf8',
                borderWidth: 1.5, yAxisID: 'y1', spanGaps: true,
                hidden: visibilidadCurvas['clima'] === false
            });
            datasetsList.push({
                id: 'sensacion', type: 'line', label: '🥵 Sensación Térmica °C', data: ptsSens,
                borderColor: '#c084fc', borderDash: [4, 2],
                tension: 0.2, pointRadius: 0, pointHoverRadius: 4, pointHoverBackgroundColor: '#c084fc',
                borderWidth: 1.5, yAxisID: 'y1', spanGaps: true,
                hidden: visibilidadCurvas['sensacion'] === false
            });
        }

        datasetsList.push({
            id: 'err', type: 'bar', label: '⚠️ Errores HW', data: ptsE,
            borderColor: '#ff5252', backgroundColor: 'rgba(255, 82, 82, 0.55)',
            barThickness: 4, yAxisID: 'y2',
            hidden: visibilidadCurvas['err'] === false
        });

        if(chartInstance) {
            chartInstance.options.scales.x.min = minTs;
            chartInstance.options.scales.x.max = nowTs;
            chartInstance.data.datasets = datasetsList;
            chartInstance.update();
            construirLeyendasPildora();
        } else {
            chartInstance = new Chart(ctx, { 
                type: 'line', 
                data: { datasets: datasetsList },
                plugins: [pluginNumerosDentroGrafico, pluginCrosshairVertical],
                options: { 
                    parsed: false,
                    responsive: true, maintainAspectRatio: false,
                    layout: { padding: { left: 14, right: 14, top: 6, bottom: 0 } },
                    interaction: { mode: 'index', axis: 'x', intersect: false },
                    plugins: { 
                        legend: { display: false },
                        tooltip: { 
                            enabled: false,
                            external: renderizarTooltipExterno
                        },
                        zoom: {
                            pan: {
                                enabled: true,
                                mode: 'x',
                                onPanComplete: function() {
                                    document.getElementById('btnResetZoom').style.display = 'inline-block';
                                }
                            },
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x',
                                onZoomComplete: function() {
                                    document.getElementById('btnResetZoom').style.display = 'inline-block';
                                }
                            }
                        }
                    },
                    scales: { 
                        x: { 
                            type: 'linear',
                            min: minTs,
                            max: nowTs,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            afterBuildTicks: function(axis) {
                                const esMovil = window.innerWidth <= 768;
                                const numTicks = esMovil ? 6 : 10;
                                const nuevosTicks = [];
                                const start = axis.min;
                                const end = axis.max;
                                for (let i = 0; i < numTicks; i++) {
                                    const valTs = Math.round(start + (i * (end - start) / (numTicks - 1)));
                                    nuevosTicks.push({ value: valTs });
                                }
                                axis.ticks = nuevosTicks;
                            },
                            ticks: { 
                                minRotation: 0, maxRotation: 0, autoSkip: false,
                                align: 'center',
                                color: '#8b8d9c', font: { size: 10.5 },
                                callback: function(value) {
                                    return formatearEtiquetaEjeX(new Date(value * 1000), rangoActual);
                                }
                            }
                        }, 
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)' }, 
                            min: 0,
                            ticks: { display: false }
                        }, 
                        y1: { 
                            position: 'right', 
                            grid: { drawOnChartArea: false }, 
                            min: -10, max: 100,
                            ticks: { display: false, stepSize: 20 }
                        },
                        y2: { display: false, min: 0, suggestedMax: 15 }
                    } 
                } 
            });
            configurarEventosLimitesCanvas();
            construirLeyendasPildora();
        }
    }

    window.addEventListener('load', function() {
        updateChart('24h');
        cargarClimaExteriorAutomatico();
    });
</script>
