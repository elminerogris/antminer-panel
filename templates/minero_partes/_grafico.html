<style>
    .custom-chart-tooltip {
        position: absolute;
        display: none;
        pointer-events: none;
        background: rgba(10, 11, 16, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 9px 12px;
        color: #fff;
        font-family: sans-serif;
        font-size: 0.78em;
        line-height: 1.45;
        z-index: 1500;
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
        transform: translateX(-50%);
    }
    .custom-chart-tooltip::before {
        content: "";
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        border-width: 0 6px 6px 6px;
        border-style: solid;
        border-color: transparent transparent rgba(10, 11, 16, 0.96) transparent;
    }
    .tt-title {
        font-weight: bold;
        margin-bottom: 5px;
        color: #fff;
        font-size: 1.02em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 3px;
    }
    .tt-row {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .tt-sub {
        padding-left: 18px;
        color: #d1d3e0;
        font-family: monospace;
        font-size: 0.95em;
    }
    .tt-box {
        width: 9px;
        height: 9px;
        display: inline-block;
        border-radius: 2px;
        flex-shrink: 0;
    }
</style>

<div class="card" style="position: relative; overflow: visible; z-index: 20;">
    <div class="panel-title">
        <div>☑ Hashrate <span id="hrPromedio" style="color:var(--text-muted); font-size:0.85em; margin-left:10px; font-weight:normal;"></span></div>
        <div class="chart-filters">
            <button class="btn-filter" id="btn-6h" onclick="updateChart('6h')">6 h</button>
            <button class="btn-filter active" id="btn-24h" onclick="updateChart('24h')">24 h</button>
            <button class="btn-filter" id="btn-7d" onclick="updateChart('7d')">7 d</button>
            <button class="btn-filter" id="btn-30d" onclick="updateChart('30d')">30 d</button>
        </div>
    </div>
    <div id="chartWrapper" style="height: 290px; position: relative;">
        <canvas id="hashrateChart"></canvas>
        <div id="customChartTooltip" class="custom-chart-tooltip" translate="no"></div>
    </div>
</div>

<script>
    const unidadMinero = "{{ ultimo.unidad }}";
    const rawFechas = {{ graf_fechas_raw | safe }};
    const rawHr = {{ graf_hashrate | safe }};
    const rawTemp = {{ graf_temps | safe }};
    const rawAmb = {{ graf_temp_amb | default('[]') | safe }};
    const rawErr = {{ graf_errores | default('[]') | safe }};
    const rawCadHist = {{ graf_cadenas_hist | default('[]') | safe }};
    const cadenasActuales = {{ cadenas_json | default('[]') | safe }};
    const tempAmbActual = {{ ultimo.temp_amb | default(0) }};
    let chartInstance = null;
    let rangoActual = '24h';
    let cursorDentroArea = false;

    function formatearFechaTooltip(d) {
        let dia = String(d.getDate()).padStart(2, '0');
        let mes = String(d.getMonth() + 1).padStart(2, '0');
        let anio = String(d.getFullYear()).slice(-2);
        let horas = String(d.getHours()).padStart(2, '0');
        let mins = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${anio} ${horas}:${mins}`;
    }

    function formatearEtiquetaEjeX(d, rango) {
        let horas = String(d.getHours()).padStart(2, '0');
        let mins = String(d.getMinutes()).padStart(2, '0');
        let horaStr = `${horas}:${mins}`;
        if (rango === '7d' || rango === '30d') {
            let dia = String(d.getDate()).padStart(2, '0');
            let mes = String(d.getMonth() + 1).padStart(2, '0');
            return [horaStr, `${dia}/${mes}`];
        }
        return horaStr;
    }

    function ocultarTooltipGris() {
        cursorDentroArea = false;
        const ttEl = document.getElementById('customChartTooltip');
        if (ttEl) ttEl.style.display = 'none';
        if (chartInstance) {
            chartInstance.setActiveElements([]);
            chartInstance.update('none');
        }
    }

    function renderizarTooltipExterno(context) {
        const { chart, tooltip } = context;
        const ttEl = document.getElementById('customChartTooltip');
        if (!ttEl) return;

        if (tooltip.opacity === 0 || !cursorDentroArea || !tooltip.dataPoints || tooltip.dataPoints.length === 0) {
            ttEl.style.display = 'none';
            return;
        }

        const dp0 = tooltip.dataPoints[0];
        if (dp0.parsed.y === null || dp0.parsed.y === undefined) {
            ttEl.style.display = 'none';
            return;
        }

        const idx = dp0.dataIndex;
        const tsSegundos = dp0.parsed.x;
        const titulo = formatearFechaTooltip(new Date(tsSegundos * 1000));
        let html = `<div class="tt-title">${titulo}</div>`;

        tooltip.dataPoints.forEach(dp => {
            const dsId = dp.dataset.id;
            const valY = dp.parsed.y;
            if (valY === null || valY === undefined) return;

            if (dsId === 'hr') {
                html += `<div class="tt-row"><span class="tt-box" style="background:#3366ff;"></span>⚡ Hashrate: <b>${valY} ${unidadMinero}</b></div>`;
            } else if (dsId === 'tmax') {
                let estadoT = valY >= 85 ? '🔴 Crítica' : (valY >= 75 ? '🟠 Advertencia' : '🟢 Normal');
                html += `<div class="tt-row"><span class="tt-box" style="background:#ffb300;"></span>🌡️ Temp Max: <b>${valY}°C</b> (${estadoT})</div>`;
                let cads = (dp.dataset.cadsHist && dp.dataset.cadsHist[idx]) ? dp.dataset.cadsHist[idx] : cadenasActuales;
                if (cads && cads.length > 0) {
                    for (let c = 0; c < cads.length; c++) {
                        html += `<div class="tt-sub">Placa #${cads[c].id} -> Chip: ${cads[c].temp_c}°C | PCB: ${cads[c].temp_p}°C</div>`;
                    }
                }
            } else if (dsId === 'tamb') {
                let valA = valY || tempAmbActual;
                if (valA && valA > 0) {
                    html += `<div class="tt-row"><span class="tt-box" style="background:#00e676;"></span>🍃 Temp Ambiente: <b>${valA}°C</b></div>`;
                }
            } else if (dsId === 'err') {
                let errNuevos = valY || 0;
                let ds = (dp.dataset.deltaSecs && dp.dataset.deltaSecs[idx]) ? dp.dataset.deltaSecs[idx] : 30;
                let porSeg = (errNuevos / ds).toFixed(2);
                html += `<div class="tt-row"><span class="tt-box" style="background:#ff5252;"></span>⚠️ Errores HW: <b>${errNuevos} nuevos</b> (${porSeg} /s)</div>`;
            }
        });

        ttEl.innerHTML = html;
        ttEl.style.display = 'block';

        const chartArea = chart.chartArea;
        const wrapperW = chart.canvas.clientWidth;
        const ttW = ttEl.offsetWidth || 230;

        let posX = tooltip.caretX;
        const minX = (ttW / 2) + 6;
        const maxX = wrapperW - (ttW / 2) - 6;
        if (posX < minX) posX = minX;
        if (posX > maxX) posX = maxX;

        ttEl.style.left = posX + 'px';
        ttEl.style.top = (chartArea.bottom + 2) + 'px';
    }

    function configurarEventosLimitesCanvas() {
        const canvas = document.getElementById('hashrateChart');
        if (!canvas) return;

        function validarPosicionCursor(clientX, clientY) {
            if (!chartInstance || !chartInstance.chartArea) return;
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            const ca = chartInstance.chartArea;

            if (y > ca.bottom || y < ca.top || x < ca.left || x > ca.right) {
                ocultarTooltipGris();
            } else {
                cursorDentroArea = true;
            }
        }

        canvas.addEventListener('mousemove', function(e) {
            validarPosicionCursor(e.clientX, e.clientY);
        });

        canvas.addEventListener('mouseleave', function() {
            ocultarTooltipGris();
        });

        canvas.addEventListener('touchstart', function(e) {
            if (e.touches && e.touches.length > 0) {
                validarPosicionCursor(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: true});

        canvas.addEventListener('touchmove', function(e) {
            if (e.touches && e.touches.length > 0) {
                validarPosicionCursor(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: true});
    }

    function updateChart(rango) {
        rangoActual = rango;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + rango).classList.add('active');
        ocultarTooltipGris();
        
        // Calcular el tiempo exacto en segundos (Escala de tiempo real proporcional)
        const ultimoTsDato = rawFechas.length > 0 ? rawFechas[rawFechas.length - 1] : Math.floor(Date.now() / 1000);
        const nowTs = Math.max(Math.floor(Date.now() / 1000), ultimoTsDato);
        let segundosRango = 24 * 3600;
        if (rango === '6h') segundosRango = 6 * 3600;
        if (rango === '24h') segundosRango = 24 * 3600;
        if (rango === '7d') segundosRango = 7 * 86400;
        if (rango === '30d') segundosRango = 30 * 86400;

        const minTs = nowTs - segundosRango;
        
        let ptsH = [], ptsT = [], ptsA = [], ptsE = [], fDeltaSec = [], fCads = [];
        let valoresHrPromedio = [];

        for (let i = 0; i < rawFechas.length; i++) {
            let ts = rawFechas[i];
            if (ts >= minTs) {
                let hVal = rawHr[i];
                let tVal = rawTemp[i];

                // Si es un punto artificial de corte (>600s sin conexión), insertar null para cortar la línea
                let esCorte = (hVal === 0 && tVal === 0 && i > 0 && (ts - rawFechas[i-1]) <= 2);

                ptsH.push({ x: ts, y: esCorte ? null : hVal });
                ptsT.push({ x: ts, y: esCorte ? null : tVal });

                if (!esCorte && hVal !== null && hVal > 0) {
                    valoresHrPromedio.push(hVal);
                }
                
                let ambVal = (rawAmb.length > i && rawAmb[i] !== null && rawAmb[i] > 0) ? rawAmb[i] : null;
                if (ambVal === null && i === rawFechas.length - 1 && tempAmbActual > 0) {
                    ambVal = tempAmbActual;
                }
                ptsA.push({ x: ts, y: esCorte ? null : ambVal });
                
                let errIntervalo = (rawErr.length > i && rawErr[i] !== null) ? rawErr[i] : 0;
                let deltaS = (i > 0 && (ts - rawFechas[i-1]) > 0 && (ts - rawFechas[i-1]) <= 300) ? (ts - rawFechas[i-1]) : 30;
                ptsE.push({ x: ts, y: esCorte ? null : errIntervalo });
                fDeltaSec.push(deltaS);
                fCads.push((rawCadHist.length > i && rawCadHist[i]) ? rawCadHist[i] : cadenasActuales);
            }
        }
        
        let avgHr = valoresHrPromedio.length > 0 ? (valoresHrPromedio.reduce((a,b)=>a+b,0) / valoresHrPromedio.length).toFixed(2) : "0.00";
        let promEl = document.getElementById('hrPromedio');
        if(promEl) promEl.innerText = 'Promedio: ' + avgHr + ' ' + unidadMinero;
        
        let tieneTempAmbiente = ptsA.some(p => p.y !== null && p.y > 0) || (tempAmbActual > 0);

        let datasetsList = [
            { id: 'hr', label: 'Hashrate (' + unidadMinero + ')', data: ptsH, borderColor: '#3366ff', backgroundColor: 'rgba(51,102,255,0.1)', fill: true, tension: 0.1, pointRadius: 0, borderWidth: 2, spanGaps: false },
            { id: 'tmax', label: 'Temperatura Max °C', data: ptsT, cadsHist: fCads, borderColor: '#ffb300', borderDash: [5, 5], tension: 0.1, pointRadius: 0, borderWidth: 1.5, yAxisID: 'y1', spanGaps: false }
        ];

        if (tieneTempAmbiente) {
            datasetsList.push({
                id: 'tamb', label: 'Temp Ambiente / Entrada °C', data: ptsA,
                borderColor: '#00e676', borderDash: [3, 3], tension: 0.1, pointRadius: 0, borderWidth: 1.5, yAxisID: 'y1', spanGaps: true
            });
        }

        datasetsList.push({
            id: 'err', label: 'Errores HW (Nuevos)', data: ptsE, deltaSecs: fDeltaSec,
            borderColor: '#ff5252', backgroundColor: 'rgba(255,82,82,0.2)', fill: true, tension: 0.1, pointRadius: 0, borderWidth: 1.5, yAxisID: 'y2', spanGaps: false
        });

        if(chartInstance) {
            chartInstance.options.scales.x.min = minTs;
            chartInstance.options.scales.x.max = nowTs;
            chartInstance.data.datasets = datasetsList;
            chartInstance.update();
        } else {
            const ctx = document.getElementById('hashrateChart').getContext('2d');
            chartInstance = new Chart(ctx, { 
                type: 'line', 
                data: { datasets: datasetsList },
                options: { 
                    parsed: false,
                    responsive: true, maintainAspectRatio: false,
                    layout: { padding: { bottom: 0 } },
                    interaction: { mode: 'index', axis: 'x', intersect: false },
                    plugins: { 
                        tooltip: { 
                            enabled: false,
                            external: renderizarTooltipExterno
                        } 
                    },
                    scales: { 
                        x: { 
                            type: 'linear',
                            min: minTs,
                            max: nowTs,
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            afterBuildTicks: function(axis) {
                                const esMovil = window.innerWidth <= 768;
                                const numTicks = esMovil ? 6 : 10;
                                const nuevosTicks = [];
                                const start = axis.min;
                                const end = axis.max;
                                for (let i = 0; i < numTicks; i++) {
                                    const valTs = Math.round(start + (i * (end - start) / (numTicks - 1)));
                                    nuevosTicks.push({ value: valTs });
                                }
                                axis.ticks = nuevosTicks;
                            },
                            ticks: { 
                                minRotation: 0, maxRotation: 0, autoSkip: false,
                                color: '#8b8d9c', font: { size: 11 },
                                callback: function(value) {
                                    return formatearEtiquetaEjeX(new Date(value * 1000), rangoActual);
                                }
                            }
                        }, 
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, min: 0 }, 
                        y1: { position: 'right', grid: { drawOnChartArea: false }, min: 0, max: 100 },
                        y2: { display: false, min: 0, suggestedMax: 10 }
                    } 
                } 
            });
            configurarEventosLimitesCanvas();
        }
    }
    window.addEventListener('load', function() { updateChart('24h'); });
</script>
