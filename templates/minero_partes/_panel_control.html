<style>
    /* Tarjeta Principal del Centro de Control y Logs */
    .ctrl-card-pro {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 16px;
        position: relative;
    }
    .ctrl-grid-sections {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
    }
    .ctrl-box {
        background: var(--bg-well);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        padding: 14px;
    }
    .ctrl-box-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-weight: bold;
        font-size: 0.92em;
        color: var(--text-main);
    }
    .ctrl-box-sub {
        font-size: 0.78em;
        color: var(--text-muted);
        font-weight: normal;
        font-family: monospace;
    }

    /* Botones de Control con Efecto Neon Glow Semántico */
    .ctrl-buttons-wrap {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .btn-ctrl-pro {
        background: var(--bg-well-soft);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 8px 13px;
        border-radius: 7px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.80em;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        user-select: none;
        flex: 1 1 auto;
        justify-content: center;
    }
    .btn-ctrl-pro:active {
        transform: translateY(0);
    }

    /* Variantes de Brillo (Glow) al pasar el mouse */
    .btn-ctrl-pro.glow-blue:hover, .btn-ctrl-pro.glow-blue.active {
        color: #fff;
        background: #2563eb;
        border-color: #3b82f6;
        box-shadow: 0 0 14px rgba(59, 130, 246, 0.45);
        transform: translateY(-1px);
    }
    .btn-ctrl-pro.glow-green {
        color: var(--accent-green);
        border-color: rgba(0, 230, 118, 0.35);
    }
    .btn-ctrl-pro.glow-green:hover, .btn-ctrl-pro.glow-green.active {
        color: #fff;
        background: #059669;
        border-color: #059669;
        box-shadow: 0 0 14px rgba(0, 230, 118, 0.4);
        transform: translateY(-1px);
    }
    .btn-ctrl-pro.glow-orange {
        color: var(--accent-gold);
        border-color: rgba(255, 179, 0, 0.35);
    }
    .btn-ctrl-pro.glow-orange:hover, .btn-ctrl-pro.glow-orange.active {
        color: #fff;
        background: #d97706;
        border-color: #d97706;
        box-shadow: 0 0 14px rgba(255, 179, 0, 0.4);
        transform: translateY(-1px);
    }
    .btn-ctrl-pro.glow-red {
        color: var(--accent-red);
        border-color: rgba(255, 82, 82, 0.35);
    }
    .btn-ctrl-pro.glow-red:hover {
        color: #fff;
        background: #dc2626;
        border-color: #dc2626;
        box-shadow: 0 0 14px rgba(255, 82, 82, 0.45);
        transform: translateY(-1px);
    }
    .btn-ctrl-pro.glow-gold {
        color: var(--accent-gold);
        border-color: rgba(250, 204, 21, 0.4);
    }
    .btn-ctrl-pro.glow-gold:hover, .btn-ctrl-pro.glow-gold.blinking {
        color: #fff;
        background: #ca8a04;
        border-color: #ca8a04;
        box-shadow: 0 0 15px rgba(250, 204, 21, 0.55);
        transform: translateY(-1px);
    }

    /* Consola / Terminal Unificada de Diagnóstico (Logs) */
    .terminal-section-pro {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border-subtle);
    }
    .terminal-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
    }
    .terminal-tabs {
        display: inline-flex;
        gap: 5px;
        flex-wrap: wrap;
        background: var(--bg-well-deep);
        padding: 4px;
        border-radius: 8px;
        border: 1px solid var(--border-subtle);
    }
    .btn-log-tab {
        background: transparent;
        border: 1px solid transparent;
        color: var(--text-muted);
        padding: 5px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.76em;
        font-weight: bold;
        font-family: monospace;
        transition: all 0.18s ease;
    }
    .btn-log-tab:hover {
        color: var(--text-main);
        background: rgba(51, 102, 255, 0.14);
        border-color: rgba(82, 140, 255, 0.5);
    }
    .btn-log-tab.active {
        color: var(--accent-cyan);
        background: rgba(56, 189, 248, 0.16);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 10px rgba(56, 189, 248, 0.28);
    }

    /* Controles de búsqueda y copia dentro del visor de Logs */
    .terminal-actions {
        display: none;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .input-log-filter {
        background: var(--bg-input);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 0.76em;
        font-family: monospace;
        outline: none;
        width: 150px;
    }
    .input-log-filter:focus {
        border-color: var(--accent-cyan);
    }
    .btn-term-mini {
        background: var(--bg-well-soft);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 4px 9px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.75em;
        font-weight: bold;
        transition: 0.15s;
    }
    .btn-term-mini:hover {
        color: var(--text-main);
        border-color: var(--accent-blue);
    }

    .terminal-window-pro {
        display: none;
        background: var(--bg-terminal);
        color: #00e676;
        padding: 14px;
        border-radius: 7px;
        font-family: monospace;
        font-size: 0.80em;
        line-height: 1.45;
        height: 290px;
        overflow-y: auto;
        border: 1px solid rgba(56, 189, 248, 0.3);
        margin-top: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    /* Modal de Confirmación Oscuro (mismo estilo del panel) */
    .ctrl-modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.72);
        z-index: 2500;
        align-items: center;
        justify-content: center;
        padding: 15px;
        backdrop-filter: blur(3px);
    }
    .ctrl-modal-box {
        background: var(--bg-card);
        border: 1px solid rgba(59, 130, 246, 0.4);
        border-radius: 10px;
        padding: 22px;
        max-width: 390px;
        width: 100%;
        text-align: center;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.78);
    }
    .ctrl-modal-title {
        font-size: 1.08em;
        font-weight: bold;
        color: var(--text-main);
        margin-bottom: 10px;
    }
    .ctrl-modal-text {
        font-size: 0.88em;
        color: var(--text-muted);
        line-height: 1.45;
        margin-bottom: 20px;
    }
    .ctrl-modal-actions {
        display: flex;
        gap: 10px;
    }
</style>

<!-- Modal de Confirmación para Comandos -->
<div class="ctrl-modal-overlay" id="ctrlConfirmModal" onclick="if(event.target===this) cerrarCtrlConfirm()">
    <div class="ctrl-modal-box">
        <div class="ctrl-modal-title" id="ctrlConfirmTitle">Confirmar orden</div>
        <div class="ctrl-modal-text" id="ctrlConfirmText"></div>
        <div class="ctrl-modal-actions">
            <button type="button" class="btn-ctrl-pro glow-blue" onclick="cerrarCtrlConfirm()">Cancelar</button>
            <button type="button" class="btn-ctrl-pro glow-blue active" id="btnCtrlConfirmExec">Confirmar</button>
        </div>
    </div>
</div>

<div class="ctrl-card-pro" data-no-live-patch="1">
    <!-- SECCIÓN CONSOLA UNIFICADA DE LOGS DEL KERNEL Y HASHBOARDS -->
    <div class="terminal-section-pro">
        <div class="terminal-toolbar">
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                <span style="font-weight:bold; font-size:0.9em; color:var(--text-main);">🖥️ Consola de Diagnóstico:</span>
                <div class="terminal-tabs">
                    <button type="button" class="btn-log-tab" id="tab-get_log" data-ctrl-tt="log_kernel" onclick="abrirLogUnificado('get_log')">Kernel Log</button>
                    <button type="button" class="btn-log-tab" id="tab-hlog" data-ctrl-tt="log_hlog" onclick="abrirLogUnificado('hlog')">hlog (Placas)</button>
                    <button type="button" class="btn-log-tab" id="tab-clog" data-ctrl-tt="log_clog" onclick="abrirLogUnificado('clog')">clog (Control)</button>
                    <button type="button" class="btn-log-tab" id="tab-dlog" data-ctrl-tt="log_dlog" onclick="abrirLogUnificado('dlog')">dlog (Debug)</button>
                </div>
            </div>

            <div class="terminal-actions" id="terminalActionsBar">
                <input type="text" id="inputFiltroLog" class="input-log-filter" placeholder="🔍 Filtrar (ej: error, temp, water)..." oninput="filtrarTextoTerminal()">
                <button type="button" class="btn-term-mini" onclick="filtrarSoloErroresLog()" title="Mostrar solo líneas con errores o advertencias">⚠️ Solo Errores</button>
                <button type="button" class="btn-term-mini" onclick="copiarLogPortapapeles(this)" title="Copiar log completo">📋 Copiar</button>
                <button type="button" class="btn-term-mini" onclick="cerrarConsolaLog()" title="Ocultar consola">✖</button>
            </div>
        </div>

        <div id="terminalUnificadaBox" class="terminal-window-pro" translate="no">Seleccione una pestaña de log arriba...</div>
    </div>
</div>

<script>
    let contenidoLogOriginalCache = "";
    let tipoLogActivo = "";
    let accionCtrlPendiente = null;

    const INFO_TOOLTIPS_CTRL = {
        'modo_normal': {
            titulo: '▶ Modo Normal de Minería',
            desc: 'Reanuda el trabajo de todas las placas hash a su frecuencia nominal configurada.',
            rango: 'Estado estándar de producción 24/7'
        },
        'modo_sleep': {
            titulo: '😴 Modo Reposo (Sleep Mode)',
            desc: 'Apaga la alimentación de las placas hash dejando encendida solo la placa de control con consumo mínimo (~40W). Ideal para cortes programados o calor extremo.',
            rango: 'Hashrate: 0 TH/s | Mantiene conexión web activa'
        },
        'perfil_eco': {
            titulo: '❄️ Perfil Bajo Consumo (Low Power Mode)',
            desc: 'Reduce ligeramente el voltaje y frecuencia del minero para mejorar la eficiencia (J/TH) y bajar la temperatura entre 4°C y 7°C.',
            rango: 'Recomendado en olas de calor o tarifas eléctricas altas'
        },
        'perfil_max': {
            titulo: '🔥 Perfil Potencia Estándar / Alta',
            desc: 'Configura el work-mode del firmware Bitmain para entregar el máximo hashrate nominal del equipo.',
            rango: 'Requiere buena ventilación (< 78°C en aire / < 68°C en Hydro)'
        },
        'hw_reboot': {
            titulo: '🔄 Reinicio Completo del Sistema (Reboot)',
            desc: 'Reinicia el sistema operativo Linux de la placa de control y vuelve a sincronizar todos los chips ASIC desde cero.',
            rango: 'Tiempo de reconexión: 2 a 4 minutos'
        },
        'hw_blink': {
            titulo: '💡 Localizador Físico por LED (Blink)',
            desc: 'Hace parpadear rápidamente las luces LED roja y verde del minero en el rack para que el técnico identifique físicamente cuál máquina es.',
            rango: 'Útil en granjas con decenas de equipos iguales'
        },
        'log_kernel': {
            titulo: '📜 Kernel Log (Registro Principal)',
            desc: 'Muestra el arranque del sistema, detección de ventiladores, fallas de fuente (PSU), temperatura, agua (Hydro) y conexión con los pools.',
            rango: 'Ideal para diagnosticar por qué un equipo se detuvo'
        },
        'log_hlog': {
            titulo: '📊 hlog (Diagnóstico de Placas Hash)',
            desc: 'Registro específico del estado de los chips ASIC, voltajes de dominio y calibración de frecuencia por cadena.',
            rango: 'Permite ver si un chip específico corta la cadena'
        },
        'log_clog': {
            titulo: '📄 clog (Control Board Log)',
            desc: 'Eventos internos del proceso bmminer/cgminer en la tarjeta controladora.',
            rango: 'Auditoría de comandos y reinicios de software'
        },
        'log_dlog': {
            titulo: '🔍 dlog (Debug Hardware Log)',
            desc: 'Registro detallado de bajo nivel de comunicación I2C/UART entre la controladora, sensores de temperatura y PSU.',
            rango: 'Para soporte electrónico avanzado'
        }
    };

    function ejecutarComandoPro(titulo, mensajeConfirm, urlCmd, textoExito, recargar = false, onConfirm = null, onCancel = null) {
        accionCtrlPendiente = { urlCmd, textoExito, recargar, onConfirm, onCancel };
        const modal = document.getElementById('ctrlConfirmModal');
        const tEl = document.getElementById('ctrlConfirmTitle');
        const mEl = document.getElementById('ctrlConfirmText');
        if (tEl) tEl.innerText = titulo;
        if (mEl) mEl.innerText = mensajeConfirm;
        if (modal) modal.style.display = 'flex';
    }

    function cerrarCtrlConfirm() {
        if (accionCtrlPendiente && typeof accionCtrlPendiente.onCancel === 'function') {
            try { accionCtrlPendiente.onCancel(); } catch(e) {}
        }
        accionCtrlPendiente = null;
        const modal = document.getElementById('ctrlConfirmModal');
        if (modal) modal.style.display = 'none';
    }

    const btnCtrlExec = document.getElementById('btnCtrlConfirmExec');
    if (btnCtrlExec) {
        btnCtrlExec.addEventListener('click', function() {
            if (!accionCtrlPendiente) return;
            const { urlCmd, textoExito, recargar, onConfirm } = accionCtrlPendiente;
            cerrarCtrlConfirm();

            if (typeof onConfirm === 'function') onConfirm();

            const badge = document.getElementById('estadoComandoBadge');
            if (badge) {
                badge.style.color = '#38bdf8';
                badge.innerText = '⏳ Enviando orden...';
            }
            fetch(urlCmd)
                .then(() => {
                    if (badge) {
                        badge.style.color = '#00e676';
                        badge.innerText = '✅ ' + (textoExito || 'En cola (15-30s)');
                    }
                    if (recargar) {
                        setTimeout(() => location.reload(), 2200);
                    } else {
                        setTimeout(() => {
                            if (badge) {
                                badge.style.color = 'var(--text-muted)';
                                badge.innerText = '● Listo';
                            }
                        }, 5000);
                    }
                })
                .catch(() => {
                    if (badge) {
                        badge.style.color = '#ff5252';
                        badge.innerText = '❌ Error de red';
                    }
                });
        });
    }

    function activarLedLocator() {
        const btn = document.getElementById('btnLedLocator');
        ejecutarComandoPro(
            '💡 Localizar con LED',
            '¿Hacer parpadear el LED físico de este minero para ubicarlo en el rack?',
            '/cmd/{{ ip }}/blink',
            'LED Parpadeando',
            false,
            function() {
                if (btn) {
                    btn.classList.add('blinking');
                    setTimeout(() => btn.classList.remove('blinking'), 6000);
                }
            }
        );
    }

    function abrirLogUnificado(tipo) {
        tipoLogActivo = tipo;
        document.querySelectorAll('.btn-log-tab').forEach(b => b.classList.remove('active'));
        const tabBtn = document.getElementById('tab-' + tipo);
        if (tabBtn) tabBtn.classList.add('active');

        const box = document.getElementById('terminalUnificadaBox');
        const actions = document.getElementById('terminalActionsBar');
        const inputF = document.getElementById('inputFiltroLog');
        if (inputF) inputF.value = '';

        box.style.display = 'block';
        actions.style.display = 'flex';
        box.innerText = `⏳ Solicitando [${tipo}] al minero {{ ip }} a través del Agente...\nEsperando respuesta (2-4 segundos)...`;

        fetch('/cmd/{{ ip }}/' + tipo).then(() => {
            setTimeout(async () => {
                try {
                    let r = await fetch('/api/ver_log/{{ ip }}', { cache: 'no-store' });
                    let txt = await r.text();
                    contenidoLogOriginalCache = txt || 'Sin datos devueltos por el minero.';
                    box.innerText = contenidoLogOriginalCache;
                    box.scrollTop = box.scrollHeight;
                } catch (e) {
                    box.innerText = 'Error al recuperar el log desde el servidor.';
                }
            }, 2400);
        });
    }

    function filtrarTextoTerminal() {
        const q = (document.getElementById('inputFiltroLog').value || '').toLowerCase().trim();
        const box = document.getElementById('terminalUnificadaBox');
        if (!box || !contenidoLogOriginalCache) return;
        if (!q) {
            box.innerText = contenidoLogOriginalCache;
            box.scrollTop = box.scrollHeight;
            return;
        }
        const lineas = contenidoLogOriginalCache.split('\n');
        const filtradas = lineas.filter(l => l.toLowerCase().includes(q));
        box.innerText = filtradas.length > 0
            ? `--- Mostrando ${filtradas.length} línea(s) que coinciden con "${q}" ---\n\n` + filtradas.join('\n')
            : `No se encontraron líneas con "${q}" en este log.`;
    }

    function filtrarSoloErroresLog() {
        const inputF = document.getElementById('inputFiltroLog');
        const box = document.getElementById('terminalUnificadaBox');
        if (!box || !contenidoLogOriginalCache) return;
        if (inputF) inputF.value = 'ERROR / WARN / TEMP';

        const patron = /(error|err|fail|warn|fatal|missing|fan lost|overheat|high temp|temp_over|over max temp|pcb temp|water|protect|shutdown|crc|socket|dead)/i;
        const lineas = contenidoLogOriginalCache.split('\n');
        const criticas = lineas.filter(l => patron.test(l));
        box.innerText = criticas.length > 0
            ? `⚠️ --- ${criticas.length} Eventos Críticos / Advertencias Detectadas ---\n\n` + criticas.join('\n')
            : `✅ No se detectaron errores críticos (error, fail, fan lost, temp_over, overheat) en este registro.`;
    }

    function copiarLogPortapapeles(btnEl) {
        const box = document.getElementById('terminalUnificadaBox');
        if (!box || !box.innerText) return;
        navigator.clipboard.writeText(box.innerText).then(() => {
            const orig = btnEl.innerText;
            btnEl.innerText = '✅ Copiado';
            setTimeout(() => { btnEl.innerText = orig; }, 1400);
        });
    }

    function cerrarConsolaLog() {
        document.getElementById('terminalUnificadaBox').style.display = 'none';
        document.getElementById('terminalActionsBar').style.display = 'none';
        document.querySelectorAll('.btn-log-tab').forEach(b => b.classList.remove('active'));
    }

    window.addEventListener('load', function() {
        document.querySelectorAll('[data-ctrl-tt]').forEach(el => {
            const key = el.getAttribute('data-ctrl-tt');
            const info = INFO_TOOLTIPS_CTRL[key];
            if (!info) return;

            el.addEventListener('mouseenter', function() {
                if (typeof mostrarSmartTooltip === 'function') {
                    mostrarSmartTooltip(el, info);
                }
            });
            el.addEventListener('mouseleave', function() {
                if (typeof ocultarSmartTooltip === 'function') {
                    ocultarSmartTooltip();
                }
            });
        });
    });
</script>
