<style>
    .farm-card.drag-over-target {
        outline: 2px dashed #3b82f6 !important;
        outline-offset: 2px;
        background: rgba(59, 130, 246, 0.08) !important;
        box-shadow: 0 0 24px rgba(59, 130, 246, 0.25) !important;
        transition: all 0.18s ease;
    }
    .asic-dragging {
        opacity: 0.45 !important;
        transform: scale(0.95);
        cursor: grabbing !important;
    }
    .move-route-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--bg-well-deep);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px 14px;
        margin: 12px 0;
    }
    .move-route-col {
        flex: 1;
        min-width: 0;
    }
    .move-route-lbl {
        font-size: 0.72em;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .move-route-val {
        font-weight: bold;
        font-size: 0.92em;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
    }
</style>

<!-- Modal 1: Crear / Editar Granja -->
<div class="farm-modal-overlay" id="farmModal">
    <div class="farm-modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:16px;">
            <span style="font-weight:bold; font-size:1.08em;" id="farmModalTitle">🏭 Nueva Granja / Sede</span>
            <button type="button" class="btn-edit-cap" onclick="cerrarFarmModal()">✖</button>
        </div>
        <input type="hidden" id="fm_id">
        <div class="fm-group">
            <label>Nombre de la Granja / Galpón</label>
            <input type="text" id="fm_nombre" class="fm-input" placeholder="Ej: Galpón Norte - Santa Cruz">
        </div>
        <div class="fm-group">
            <label>Ciudad / Ubicación</label>
            <input type="text" id="fm_ciudad" class="fm-input" placeholder="Ej: Santa Cruz de la Sierra">
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="fm-group">
                <label>Capacidad Transformador (kW)</label>
                <input type="number" id="fm_cap_kw" class="fm-input" value="50" min="1">
            </div>
            <div class="fm-group">
                <label>Tarifa Eléctrica (USD/kWh)</label>
                <input type="number" step="0.01" id="fm_tarifa" class="fm-input" value="0.06" min="0">
            </div>
        </div>
        <div class="fm-group">
            <label>IP del Router / Gateway</label>
            <input type="text" id="fm_gateway" class="fm-input" placeholder="Ej: 192.168.0.1 o 192.168.0.125">
        </div>
        <div class="fm-group">
            <label>Notas del Técnico</label>
            <input type="text" id="fm_notas" class="fm-input" placeholder="Ej: Transformador 75 kVA · Rack A">
        </div>
        <div style="display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:18px;">
            <button type="button" id="btnEliminarGranja" class="btn-farm-cmd reboot" style="flex:0 0 auto; padding:8px 12px; display:none;" onclick="eliminarGranjaActual()">🗑️ Eliminar</button>
            <div style="display:flex; gap:10px; margin-left:auto;">
                <button type="button" class="btn-farm-cmd" style="flex:0 0 auto; padding:8px 14px;" onclick="cerrarFarmModal()">Cancelar</button>
                <button type="button" class="btn-emg-save" onclick="guardarConfigGranja()"
                        data-save-title="💾 Guardar Configuración de Granja"
                        data-save-desc="Guarda el nombre, ciudad, capacidad eléctrica (kW), tarifa, gateway y notas de esta sede."
                        data-save-note="Los cambios se reflejan al instante en el panel de granjas">💾 Guardar</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal 2: Editar Nombre o Mover ASIC a otra Granja -->
<div class="farm-modal-overlay" id="mineroMoveModal">
    <div class="farm-modal-box">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:16px;">
            <span style="font-weight:bold; font-size:1.08em;">✏️ Editar / Mover ASIC</span>
            <button type="button" class="btn-edit-cap" onclick="cerrarMineroModal()">✖</button>
        </div>
        <input type="hidden" id="mm_ip">
        <div class="fm-group">
            <label>IP del Equipo</label>
            <input type="text" id="mm_ip_display" class="fm-input" disabled style="opacity:0.75;">
        </div>
        <div class="fm-group">
            <label>Nombre del ASIC</label>
            <input type="text" id="mm_nombre" class="fm-input" placeholder="Ej: Rack-01-S21">
        </div>
        <div class="fm-group">
            <label>Granja / Sede Asignada</label>
            <select id="mm_farm_id" class="fm-input">
                {% for g_opt in granjas %}
                <option value="{{ g_opt.farm_id }}">{{ g_opt.nombre }} ({{ g_opt.ciudad }})</option>
                {% endfor %}
            </select>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;">
            <button type="button" class="btn-farm-cmd" style="flex:0 0 auto; padding:8px 14px;" onclick="cerrarMineroModal()">Cancelar</button>
            <button type="button" class="btn-emg-save" onclick="guardarEdicionMinero()"
                    data-save-title="💾 Guardar Cambios del ASIC"
                    data-save-desc="Actualiza el nombre personalizado del minero y/o lo reasigna a la granja o sede seleccionada."
                    data-save-note="No reinicia ni detiene el minado del equipo">💾 Guardar Cambios</button>
        </div>
    </div>
</div>

<!-- Modal 3: Confirmación Profesional de Traslado (Drag & Drop) -->
<div class="farm-modal-overlay" id="dragConfirmModal">
    <div class="farm-modal-box" style="max-width:440px;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:14px;">
            <span style="font-weight:bold; font-size:1.06em;">🚚 Confirmar traslado de ASIC</span>
            <button type="button" class="btn-edit-cap" onclick="cancelarTrasladoDrag()">✖</button>
        </div>
        <div style="font-size:0.92em; color:var(--text-muted); margin-bottom:8px;">
            Estás por mover el equipo <b id="dc_asic_nombre" style="color:var(--text-main);"></b> (<span id="dc_asic_ip" style="font-family:monospace; color:#60a5fa;"></span>):
        </div>
        <div class="move-route-box">
            <div class="move-route-col">
                <div class="move-route-lbl">Origen</div>
                <div class="move-route-val" id="dc_origen_nombre">-</div>
            </div>
            <div style="font-size:1.3em; color:#3b82f6; font-weight:bold;">➔</div>
            <div class="move-route-col" style="text-align:right;">
                <div class="move-route-lbl">Destino</div>
                <div class="move-route-val" id="dc_destino_nombre" style="color:#34d399;">-</div>
            </div>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:18px;">
            <button type="button" class="btn-farm-cmd" style="flex:0 0 auto; padding:8px 16px;" onclick="cancelarTrasladoDrag()">Cancelar</button>
            <button type="button" id="btnConfirmarTraslado" class="btn-new-farm" onclick="confirmarTrasladoDrag()">✅ Aceptar traslado</button>
        </div>
    </div>
</div>

<!-- Modal 4: Eliminar Granja (con opción de borrado completo o traslado de ASICs) -->
<div class="farm-modal-overlay" id="farmDeleteModal" onclick="if(event.target===this) cerrarModalEliminarGranja()">
    <div class="farm-modal-box" style="max-width:460px; border-color:rgba(255,82,82,0.5);">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:10px; margin-bottom:14px;">
            <span style="font-weight:bold; font-size:1.06em; color:#ef4444;">🗑️ Eliminar Granja</span>
            <button type="button" class="btn-edit-cap" onclick="cerrarModalEliminarGranja()">✖</button>
        </div>
        <input type="hidden" id="fd_farm_id">
        <div style="font-size:0.9em; color:var(--text-main); line-height:1.5; margin-bottom:12px;">
            Vas a eliminar la granja <b id="fd_farm_name"></b>.
            <span id="fd_miners_summary" style="color:var(--text-muted);"></span>
        </div>

        <div id="fd_options_box" style="display:flex; flex-direction:column; gap:8px; margin-bottom:14px;">
            <label style="display:flex; align-items:flex-start; gap:9px; padding:10px 12px; border-radius:8px; border:1px solid rgba(255,82,82,0.35); background:rgba(255,82,82,0.08); cursor:pointer; font-size:0.84em;">
                <input type="radio" name="fd_accion" id="fd_mode_delete" value="delete" checked onchange="toggleFdMoveSelect()" style="margin-top:3px;">
                <span>
                    <strong style="color:#ef4444; display:block;">Eliminar granja y todos sus registros</strong>
                    <small style="color:var(--text-muted);">Quita la granja, sus ASICs, racks y cachés del panel y del mapa Admin.</small>
                </span>
            </label>
            <label id="fd_move_row" style="display:none; align-items:flex-start; gap:9px; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background:var(--bg-well); cursor:pointer; font-size:0.84em;">
                <input type="radio" name="fd_accion" id="fd_mode_move" value="move" onchange="toggleFdMoveSelect()" style="margin-top:3px;">
                <div style="flex:1; min-width:0;">
                    <strong style="color:var(--text-main); display:block;">Eliminar solo la granja y mover sus ASICs a:</strong>
                    <div id="fd_dest_wrap" style="margin-top:7px; display:none;">
                        <select id="fd_move_farm" class="fm-input" style="padding:6px 9px; font-size:0.92em;">
                            {% for g_opt in granjas %}
                            <option value="{{ g_opt.farm_id }}">{{ g_opt.nombre }} ({{ g_opt.ciudad }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </label>
        </div>

        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
            <button type="button" class="btn-farm-cmd" style="flex:0 0 auto; padding:8px 16px;" onclick="cerrarModalEliminarGranja()">Cancelar</button>
            <button type="button" id="btnConfirmarEliminarGranja" class="btn-farm-cmd reboot" style="flex:0 0 auto; padding:8px 16px;" onclick="confirmarEliminarGranja()">🗑️ Eliminar Granja</button>
        </div>
    </div>
</div>

<script>
    let _dragPayload = null;

    function mostrarFarmToast(msg) {
        const t = document.getElementById('farmToast');
        if (!t) return;
        t.innerText = '✅ ' + msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function abrirNuevaGranjaModal() {
        document.getElementById('farmModalTitle').innerText = '🏭 Nueva Granja / Sede';
        document.getElementById('fm_id').value = '';
        document.getElementById('fm_nombre').value = '';
        document.getElementById('fm_ciudad').value = 'Santa Cruz de la Sierra';
        document.getElementById('fm_cap_kw').value = 50;
        document.getElementById('fm_tarifa').value = 0.06;
        document.getElementById('fm_gateway').value = '192.168.0.1';
        document.getElementById('fm_notas').value = '';
        document.getElementById('btnEliminarGranja').style.display = 'none';
        document.getElementById('farmModal').style.display = 'flex';
    }

    function editarGranjaModal(farmId, nombre, ciudad, capKw, tarifa, gateway, notas, esManual) {
        document.getElementById('farmModalTitle').innerText = '⚙️ Configurar Granja';
        document.getElementById('fm_id').value = farmId;
        document.getElementById('fm_nombre').value = nombre || '';
        document.getElementById('fm_ciudad').value = ciudad || '';
        document.getElementById('fm_cap_kw').value = capKw || 50;
        document.getElementById('fm_tarifa').value = tarifa !== undefined ? tarifa : 0.06;
        document.getElementById('fm_gateway').value = gateway || '';
        document.getElementById('fm_notas').value = notas || '';
        document.getElementById('btnEliminarGranja').style.display = farmId ? 'inline-block' : 'none';
        document.getElementById('farmModal').style.display = 'flex';
    }

    function cerrarFarmModal() {
        document.getElementById('farmModal').style.display = 'none';
    }

    function guardarConfigGranja() {
        const payload = {
            farm_id: document.getElementById('fm_id').value.trim(),
            nombre: document.getElementById('fm_nombre').value.trim(),
            ciudad: document.getElementById('fm_ciudad').value.trim(),
            cap_kw: parseFloat(document.getElementById('fm_cap_kw').value) || 50,
            tarifa_kwh: parseFloat(document.getElementById('fm_tarifa').value) || 0,
            gateway: document.getElementById('fm_gateway').value.trim(),
            notas: document.getElementById('fm_notas').value.trim()
        };
        if (!payload.nombre) return;

        fetch('/api/granjas/guardar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(d => {
            if (d.status === 'ok') {
                cerrarFarmModal();
                mostrarFarmToast('Granja guardada correctamente.');
                setTimeout(() => window.location.reload(), 650);
            }
        });
    }

    function abrirModalEliminarGranja(farmId, nombre, totalMineros) {
        if (!farmId) return;
        const fid = String(farmId);
        document.getElementById('fd_farm_id').value = fid;
        document.getElementById('fd_farm_name').innerText = nombre ? `"${nombre}"` : fid;
        const count = Number(totalMineros || 0);
        document.getElementById('fd_miners_summary').innerText = count > 0
            ? ` Actualmente tiene ${count} equipo(s) ASIC asignado(s).`
            : ' Esta granja no tiene ASICs asignados.';

        const selMove = document.getElementById('fd_move_farm');
        let opcionesDisponibles = 0;
        if (selMove) {
            Array.from(selMove.options).forEach(opt => {
                const esMisma = (opt.value === fid);
                opt.hidden = esMisma;
                opt.disabled = esMisma;
                if (!esMisma) opcionesDisponibles++;
            });
            const primera = Array.from(selMove.options).find(o => !o.disabled);
            if (primera) selMove.value = primera.value;
        }

        const radioDel = document.getElementById('fd_mode_delete');
        const radioMove = document.getElementById('fd_mode_move');
        const moveRow = document.getElementById('fd_move_row');
        if (radioDel) radioDel.checked = true;
        if (radioMove) radioMove.checked = false;
        if (moveRow) {
            moveRow.style.display = (count > 0 && opcionesDisponibles > 0) ? 'flex' : 'none';
        }
        toggleFdMoveSelect();

        const btn = document.getElementById('btnConfirmarEliminarGranja');
        if (btn) {
            btn.disabled = false;
            btn.innerText = '🗑️ Eliminar Granja';
        }
        document.getElementById('farmDeleteModal').style.display = 'flex';
    }

    function cerrarModalEliminarGranja() {
        const m = document.getElementById('farmDeleteModal');
        if (m) m.style.display = 'none';
    }

    function toggleFdMoveSelect() {
        const moveChecked = document.getElementById('fd_mode_move')?.checked;
        const wrap = document.getElementById('fd_dest_wrap');
        if (wrap) wrap.style.display = moveChecked ? 'block' : 'none';
    }

    function confirmarEliminarGranja() {
        const farmId = (document.getElementById('fd_farm_id')?.value || '').trim();
        if (!farmId) return;
        const moveChecked = Boolean(document.getElementById('fd_mode_move')?.checked);
        const moverA = moveChecked ? (document.getElementById('fd_move_farm')?.value || '').trim() : '';

        const btn = document.getElementById('btnConfirmarEliminarGranja');
        if (btn) {
            btn.disabled = true;
            btn.innerText = '⏳ Eliminando...';
        }

        fetch('/api/granjas/eliminar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                farm_id: farmId,
                eliminar_mineros: !moveChecked,
                mover_a_farm_id: moverA
            })
        })
        .then(r => r.json())
        .then(d => {
            if (d.status === 'ok') {
                cerrarModalEliminarGranja();
                cerrarFarmModal();
                const card = document.querySelector(`.farm-card[data-farm-id="${CSS.escape(farmId)}"]`);
                if (card) card.style.opacity = '0.35';
                mostrarFarmToast(moveChecked ? 'Granja eliminada y ASICs trasladados.' : 'Granja eliminada por completo.');
                setTimeout(() => window.location.reload(), 450);
            } else {
                if (btn) { btn.disabled = false; btn.innerText = '🗑️ Eliminar Granja'; }
                alert(d.msg || 'No se pudo eliminar la granja');
            }
        })
        .catch(() => {
            if (btn) { btn.disabled = false; btn.innerText = '🗑️ Eliminar Granja'; }
        });
    }

    function eliminarGranjaActual() {
        const farmId = document.getElementById('fm_id').value.trim();
        const nombre = document.getElementById('fm_nombre').value.trim();
        let total = 0;
        if (farmId) {
            const card = document.querySelector(`.farm-card[data-farm-id="${CSS.escape(farmId)}"]`);
            if (card) total = card.querySelectorAll('.rack-tile-wrap').length;
        }
        cerrarFarmModal();
        abrirModalEliminarGranja(farmId, nombre, total);
    }

    function abrirEditarMineroModal(ip, nombre, farmId) {
        document.getElementById('mm_ip').value = ip;
        document.getElementById('mm_ip_display').value = ip;
        document.getElementById('mm_nombre').value = nombre || '';
        const sel = document.getElementById('mm_farm_id');
        if (sel && farmId) sel.value = farmId;
        document.getElementById('mineroMoveModal').style.display = 'flex';
    }

    function cerrarMineroModal() {
        document.getElementById('mineroMoveModal').style.display = 'none';
    }

    function guardarEdicionMinero() {
        const ip = document.getElementById('mm_ip').value.trim();
        const nombre = document.getElementById('mm_nombre').value.trim();
        const farm_id = document.getElementById('mm_farm_id').value;
        if (!ip) return;

        fetch('/api/granjas/editar_minero', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ip, nombre, farm_id })
        })
        .then(r => r.json())
        .then(d => {
            if (d.status === 'ok') {
                cerrarMineroModal();
                mostrarFarmToast(`ASIC ${ip} actualizado.`);
                setTimeout(() => window.location.reload(), 650);
            }
        });
    }

    // ==================== DRAG & DROP PROFESIONAL DE ASICs ====================
    function iniciarArrastreAsic(ev, ip, nombre, origenFarmId) {
        const cardOrigen = ev.currentTarget.closest('.farm-card');
        const nombreOrigen = cardOrigen
            ? (cardOrigen.querySelector('.farm-name span[translate="no"]')?.innerText?.trim() || origenFarmId)
            : origenFarmId;

        _dragPayload = {
            ip: ip,
            nombre: nombre || ip,
            origenFarmId: origenFarmId,
            origenNombre: nombreOrigen
        };
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', ip);
        ev.currentTarget.classList.add('asic-dragging');
    }

    function finalizarArrastreAsic(ev) {
        ev.currentTarget.classList.remove('asic-dragging');
        document.querySelectorAll('.farm-card.drag-over-target').forEach(el => {
            el.classList.remove('drag-over-target');
        });
    }

    function cancelarTrasladoDrag() {
        _dragPayload = null;
        document.getElementById('dragConfirmModal').style.display = 'none';
    }

    function confirmarTrasladoDrag() {
        if (!_dragPayload || !_dragPayload.destinoFarmId) return;
        const btn = document.getElementById('btnConfirmarTraslado');
        btn.disabled = true;
        btn.innerText = '⏳ Moviendo...';

        fetch('/api/granjas/editar_minero', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                ip: _dragPayload.ip,
                nombre: _dragPayload.nombre,
                farm_id: _dragPayload.destinoFarmId
            })
        })
        .then(r => r.json())
        .then(d => {
            if (d.status === 'ok') {
                document.getElementById('dragConfirmModal').style.display = 'none';
                mostrarFarmToast(`ASIC ${_dragPayload.nombre} movido a ${_dragPayload.destinoNombre}.`);
                setTimeout(() => window.location.reload(), 550);
            } else {
                btn.disabled = false;
                btn.innerText = '✅ Aceptar traslado';
            }
        })
        .catch(() => {
            btn.disabled = false;
            btn.innerText = '✅ Aceptar traslado';
        });
    }

    window.initFarmDragDropTargets = function() {
        document.querySelectorAll('.farm-card[data-farm-id]').forEach(card => {
            if (card.dataset.dragBound === '1') return;
            card.dataset.dragBound = '1';

            card.addEventListener('dragover', (e) => {
                if (!_dragPayload) return;
                const targetId = card.getAttribute('data-farm-id');
                if (targetId && targetId !== _dragPayload.origenFarmId) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    card.classList.add('drag-over-target');
                }
            });

            card.addEventListener('dragleave', (e) => {
                if (!card.contains(e.relatedTarget)) {
                    card.classList.remove('drag-over-target');
                }
            });

            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over-target');
                if (!_dragPayload) return;

                const destinoId = card.getAttribute('data-farm-id');
                if (!destinoId || destinoId === _dragPayload.origenFarmId) return;

                const destinoNombre = card.querySelector('.farm-name span[translate="no"]')?.innerText?.trim() || destinoId;
                _dragPayload.destinoFarmId = destinoId;
                _dragPayload.destinoNombre = destinoNombre;

                document.getElementById('dc_asic_nombre').innerText = _dragPayload.nombre;
                document.getElementById('dc_asic_ip').innerText = _dragPayload.ip;
                document.getElementById('dc_origen_nombre').innerText = _dragPayload.origenNombre;
                document.getElementById('dc_destino_nombre').innerText = _dragPayload.destinoNombre;

                const btn = document.getElementById('btnConfirmarTraslado');
                btn.disabled = false;
                btn.innerText = '✅ Aceptar traslado';

                document.getElementById('dragConfirmModal').style.display = 'flex';
            });
        });
    };

    document.addEventListener('DOMContentLoaded', () => {
        window.initFarmDragDropTargets();
    });

    function comandoGranja(accion, ips, nombreGranja) {
        if (!ips || ips.length === 0) return;
        if (!confirm(`¿Ejecutar "${accion}" en los ${ips.length} mineros de ${nombreGranja}?`)) return;

        fetch('/cmd_bulk', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accion: accion, ips: ips })
        }).then(() => {
            mostrarFarmToast(`Orden "${accion}" enviada a ${ips.length} equipos de ${nombreGranja}.`);
        });
    }
</script>
