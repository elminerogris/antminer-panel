<div class="router-card-box" translate="no">
    <div class="router-left">
        <div class="router-art" aria-hidden="true">
            <svg width="26" height="22" viewBox="0 0 26 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 6C8.8 4.2 17.2 4.2 19 6" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M9.5 8.5C10.9 7.2 15.1 7.2 16.5 8.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
                <rect x="2" y="11" width="22" height="8" rx="2.5" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5"/>
                <circle cx="6.5" cy="15" r="1.4" fill="#00e676"/>
                <circle cx="10.5" cy="15" r="1.4" fill="#38bdf8"/>
            </svg>
        </div>
        <div>
            <div class="router-title">
                <span>Router / Gateway</span>
                <span style="color:#60a5fa; font-family:monospace;">{{ g.gateway }}</span>
            </div>
            <div class="router-sub">
                Agente: {{ g.agent_id }} · Red {{ g.subred }}
            </div>
        </div>
    </div>
    <div class="router-actions">
        <a href="/proxy/{{ g.gateway }}/?agent_id={{ g.agent_id }}" target="_blank" rel="noopener" class="btn-router-enter">
            🌐 Entrar al Router ↗
        </a>
        <a href="/proxy/{{ g.gateway }}/?scheme=https&agent_id={{ g.agent_id }}" target="_blank" rel="noopener" class="btn-router-ssl" title="Entrar al router usando HTTPS local">
            🔒 HTTPS
        </a>
    </div>
</div>
