<style>
    .wd-minero-box {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
    }
    .wd-minero-info {
        display: flex;
        flex-direction: column;
        gap: 3px;
    }
    .wd-minero-title {
        font-weight: bold;
        font-size: 0.94em;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .wd-minero-sub {
        font-size: 0.78em;
        color: var(--text-muted);
    }
    .wd-quarantine-tag {
        background: rgba(255, 82, 82, 0.16);
        border: 1px solid rgba(255, 82, 82, 0.45);
        color: #ff8a80;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.75em;
        font-family: monospace;
        font-weight: bold;
    }
    .wd-toggle-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .wd-switch-lbl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-size: 0.84em;
        font-weight: bold;
        color: var(--text-main);
        user-select: none;
    }
    .wd-switch-lbl input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #00e676;
        cursor: pointer;
    }
    .wd-save-state {
        font-size: 0.76em;
        font-family: monospace;
        color: #00e676;
        min-width: 72px;
    }
</style>

<div class="wd-minero-box" data-no-live-patch="1">
    <div class="wd-minero-info">
        <div class="wd-minero-title">
            <span>🔄 Watchdog Individual ({{ ip }})</span>
            {% if ultimo.wd_cuarentena %}
            <span class="wd-quarantine-tag">🔒 EN CUARENTENA</span>
            {% endif %}
        </div>
        <div class="wd-minero-sub">
            Permite o excluye a este equipo del auto-reinicio configurado en <a href="/alertas" style="color:#60a5fa; text-decoration:none;">🔔 Alertas</a>.
        </div>
    </div>

    <div class="wd-toggle-wrap">
        <label class="wd-switch-lbl">
            <input type="checkbox" id="wdMineroSwitch" {% if ultimo.watchdog_activo %}checked{% endif %} onchange="guardarWatchdogMinero(this)">
            <span id="wdMineroTexto">{{ 'Permitido (ON)' if ultimo.watchdog_activo else 'Excluido (OFF)' }}</span>
        </label>
        <span id="wdMineroEstado" class="wd-save-state"></span>
    </div>
</div>

<script>
    function guardarWatchdogMinero(checkboxEl) {
        const activo = checkboxEl.checked ? 1 : 0;
        const txt = document.getElementById('wdMineroTexto');
        const st = document.getElementById('wdMineroEstado');
        if (txt) txt.innerText = activo ? 'Permitido (ON)' : 'Excluido (OFF)';
        if (st) { st.style.color = '#38bdf8'; st.innerText = 'Guardando...'; }

        fetch('/api/guardar_watchdog_minero', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ip: '{{ ip }}', activo: activo })
        })
        .then(r => r.json())
        .then(d => {
            if (st && d.status === 'ok') {
                st.style.color = '#00e676';
                st.innerText = '✔ Guardado';
                setTimeout(() => { st.innerText = ''; }, 2200);
            }
        })
        .catch(() => {
            if (st) { st.style.color = '#ff5252'; st.innerText = 'Error'; }
        });
    }
</script>
